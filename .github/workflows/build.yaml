name: Build Paste

on:
  push:
    tags: ["v*"]        # baut bei Tags wie v0.1.0
  workflow_dispatch:     # oder manuell per Button

permissions:
  contents: write        # nötig, um ein Release anzulegen

jobs:
  build:
    runs-on: macos-latest   # falls die nötige Xcode-Version fehlt: macos-26 probieren
    steps:
      - uses: actions/checkout@v4

      - name: Installierte Xcode-Versionen anzeigen
        run: ls /Applications | grep -i xcode || true

      - name: Xcode auswählen
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest   # oder genau deine Version, z. B. "26.6"

      - name: Xcode-Version anzeigen
        run: xcodebuild -version

      - name: Bauen
        run: |
          xcodebuild \
            -project Paste.xcodeproj \
            -scheme Paste \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Ad-hoc signieren und zippen
        run: |
          APP="build/Build/Products/Release/Paste.app"
          codesign --force --deep --sign - "$APP"
          ditto -c -k --keepParent "$APP" Paste.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Paste
          path: Paste.zip

      - name: Release anlegen
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Paste.zip