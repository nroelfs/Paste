name: Build Paste

on:
  push:
    tags: ["v*"]         # baut bei Tags wie v0.1.0
  workflow_dispatch:     # oder manuell per Button

permissions:
  contents: write        # nötig, um ein Release anzulegen

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Xcode auswählen
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"

      - name: Projektformat für Runner anpassen
        run: sed -i '' 's/objectVersion = 110;/objectVersion = 77;/' Paste.xcodeproj/project.pbxproj

      - name: Bauen
        run: |
          xcodebuild \
            -project Paste.xcodeproj \
            -scheme Paste \
            -configuration Release \
            -derivedDataPath build \
            MACOSX_DEPLOYMENT_TARGET=26.0 \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Ad-hoc signieren und zippen
        run: |
          APP="build/Build/Products/Release/Paste.app"
          codesign --force --deep --sign - "$APP"
          ditto -c -k --keepParent "$APP" Paste.zip
          echo "SHA256: $(shasum -a 256 Paste.zip | awk '{print $1}')"

      - uses: actions/upload-artifact@v4
        with:
          name: Paste
          path: Paste.zip

      - name: Release anlegen
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Paste.zip
          generate_release_notes: true